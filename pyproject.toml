[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "secaudit"
version = "1.0.0"
description = "Passive, non-intrusive website and domain security auditing CLI with CVE lookup and optional Ollama analysis"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1",
    "rich>=13.0",
    "httpx>=0.27",
    "dnspython>=2.6",
    "cryptography>=42",
]

[project.scripts]
secaudit = "secaudit.cli:main"
secdomains = "secaudit.cli:domains_cmd"

[tool.setuptools.packages.find]
include = ["secaudit*"]
